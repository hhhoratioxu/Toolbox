name: Desktop builds
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, label: macOS ARM64, command: 'dist:mac:arm64', app: 'dist/mac-arm64/HoriPet.app/Contents/MacOS/HoriPet', smoke: true }
          - { os: macos-15-intel, label: macOS Intel, command: 'dist:mac:x64', app: 'dist/mac/HoriPet.app/Contents/MacOS/HoriPet', smoke: true }
          - { os: windows-latest, label: Windows x64, command: 'dist:win:x64', app: 'dist/win-unpacked/HoriPet.exe', smoke: true }
          - { os: windows-latest, label: Windows ARM64 cross-build, command: 'dist:win:arm64', app: '', smoke: false }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm ${{ matrix.command }}
      - name: Run the packaged desktop app
        if: matrix.smoke
        run: pnpm test:packaged
        env:
          HORIPET_APP: ${{ github.workspace }}/${{ matrix.app }}
      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: HoriPet-${{ strategy.job-index }}
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
      - name: Upload desktop verification
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-evidence-${{ strategy.job-index }}
          path: test-results/
          if-no-files-found: ignore
  release:
    name: Publish unsigned preview
    if: startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: HoriPet-*
          path: release-assets
          merge-multiple: true
      - name: Publish installers and checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd release-assets
          sha256sum ./* > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" ./* --repo "$GITHUB_REPOSITORY" --title "HoriPet $GITHUB_REF_NAME · Preview" --notes-file ../docs/RELEASE-NOTES.md --prerelease --verify-tag
